name: CI and production deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check shared, backend and web
        run: npm run typecheck

      - name: Type-check mobile
        run: npm run typecheck -w @patrol/mobile

      - name: Lint mobile
        run: npm run lint -w @patrol/mobile

      - name: Lint web
        run: npm run lint -w @patrol/web

      - name: Test backend
        run: npm run test -w @patrol/backend -- --runInBand

      - name: Test mobile
        run: npm run test -w @patrol/mobile

      - name: Build backend and web
        run: npm run build

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: patrol-system-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/patrol-system' }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is not configured"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is not configured"; exit 1; }

          case "$DEPLOY_PORT" in
            *[!0-9]*|'') echo "DEPLOY_PORT must be a number"; exit 1 ;;
          esac

          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path"; exit 1 ;;
          esac

          case "$DEPLOY_PATH" in
            *[!A-Za-z0-9_./-]*) echo "DEPLOY_PATH contains unsupported characters"; exit 1 ;;
          esac

          case "$DEPLOY_SHA" in
            *[!0-9a-f]*|'') echo "DEPLOY_SHA is invalid"; exit 1 ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/patrol-system-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy the verified commit
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/patrol-system-deploy" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --prune origin main && git checkout main && git merge --ff-only '$DEPLOY_SHA' && git merge-base --is-ancestor '$DEPLOY_SHA' HEAD && git merge-base --is-ancestor HEAD '$DEPLOY_SHA' && APP_DIR='$DEPLOY_PATH' sh deploy/scripts/deploy-production.sh"
